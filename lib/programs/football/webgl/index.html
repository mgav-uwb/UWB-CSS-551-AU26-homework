<!doctype html>
<!-- CSS 551: the spiral-pass scene, WebGL track. Serve the course folder (python3 -m http.server) and open
     lib/programs/football/webgl/; a page opened from disk cannot load modules. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spiral Pass, WebGL</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0c10; }
    canvas { display: block; }
    #status { position: absolute; left: 10px; bottom: 10px; color: #c7cdda;
      font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; background: rgba(11, 12, 16, 0.75);
      padding: 4px 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="status"></div>
  <script type="module" src="scene.js"></script>
</body>
</html>
