<!DOCTYPE html>
<!-- CSS 551 homework runner (WebGL track). Serve the course site from its root folder
     (python3 -m http.server 8000) and open http://localhost:8000/homework/run.html?hw=hw03.
     It loads YOUR file, lib/skeletons/hwNN.js, runs the homework's checks on it, and draws
     the scene from your functions. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS 551 · Homework runner</title>
<link rel="stylesheet" href="../lib/core/lib.css">
<style>
  body { margin: 0; padding: 14px clamp(12px, 3vw, 32px) 48px; }
  .hw-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .hw-head h1 { font-size: 20px; margin: 0; color: #fff; }
  .hw-impl { color: #8b93a7; font-size: 13px; }
  .hw-impl code { color: #5cd47a; }
  .cockpit .demo-shell-root:not(.demo-shell-root--embed) { height: 64vh; min-height: 420px; }
  .hw-checks { margin-top: 18px; }
  .hw-checks h2 { font-size: 17px; margin: 0 0 8px; color: #fff; }
  .hw-score { color: #00e58a; font-weight: 600; margin-left: 10px; font-size: 15px; }
  .hw-checks table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  .hw-checks th, .hw-checks td { border: 1px solid #262a35; padding: 6px 9px; text-align: left; vertical-align: top; }
  .hw-checks th { background: #181b24; color: #fff; }
  .hw-checks td.num { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; word-break: break-word; max-width: 34ch; }
  .hw-checks tr.pass .mark { color: #00e58a; font-weight: 700; }
  .hw-checks tr.fail .mark { color: #ff6b6b; font-weight: 700; }
  .hw-checks .err { color: #ff6b6b; }
  .hw-note, .hw-msg { color: #8b93a7; font-size: 13px; }
  .hw-msg { color: #ffcf5c; padding: 10px; }
  .hw-readout { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre; color: #e7eaf0; overflow-x: auto; }
  .hw-canvas { image-rendering: pixelated; width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  .hw-2d { position: absolute; inset: 0; display: flex; gap: 12px; padding: 12px; box-sizing: border-box; }
  .hw-2d > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .hw-2d .cap { color: #8b93a7; font-size: 12px; margin: 4px 0; }
  .hw-2d canvas { flex: 1; min-height: 0; }
  @media (max-width: 820px) { .hw-2d { position: static; flex-direction: column; } .hw-2d canvas { height: 260px; flex: none; } }
</style>
</head>
<body class="cockpit">
<div id="root"></div>
<script type="module">
  import { mountHomework } from '../lib/skeletons/runner.js';
  const q = new URLSearchParams(location.search);
  const hw = (q.get('hw') || 'hw01').toLowerCase();
  // ?impl=solution loads the instructor's reference build, which exists only in the private
  // course repository; the public site has no such file.
  const solution = q.get('impl') === 'solution';
  const url = solution ? `./${hw}/solution/${hw}.js` : `../lib/skeletons/${hw}.js`;
  mountHomework(document.getElementById('root'), hw, new URL(url + `?v=${Date.now()}`, location.href).href, solution ? `homework/${hw}/solution/${hw}.js` : `lib/skeletons/${hw}.js`);
</script>
</body>
</html>
